plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 签名信息从 android/keystore.properties 读取（该文件已被 .gitignore 排除，不入库）
// 若文件缺失则回退到环境变量，便于 CI
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.socceralarm.pro'
    compileSdk 35

    defaultConfig {
        applicationId "com.socceralarm.pro"
        minSdk 24
        targetSdk 35
        versionCode 57
        versionName "2.57"
    }

    signingConfigs {
        release {
            storeFile file(keystoreProps.getProperty('storeFile', 'socceralarm-release.keystore'))
            storePassword keystoreProps.getProperty('storePassword', System.getenv('SOCCER_STORE_PASSWORD') ?: '')
            keyAlias keystoreProps.getProperty('keyAlias', 'socceralarm')
            keyPassword keystoreProps.getProperty('keyPassword', System.getenv('SOCCER_KEY_PASSWORD') ?: '')
        }
    }

    // 渠道维度：official（官网直装，保留应用内更新）/ store（应用商店，禁止自更新）
    flavorDimensions "channel"
    productFlavors {
        official {
            dimension "channel"
            buildConfigField "String", "CHANNEL", '"official"'
        }
        store {
            dimension "channel"
            buildConfigField "String", "CHANNEL", '"store"'
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}